name: cytools-agent
channels:
  - conda-forge
dependencies:
  # CYTools dependencies
  - python=3.12
  - numba
  - numpy<2.5  # numba 0.65 caps numpy at <2.5; unpinned, a rebuild floats to 2.5 and breaks the numba import
  - normaliz
  - scipy
  - cvxopt
  - python-flint
  - ppl
  - joblib
  - tqdm
  - requests
  - osqp
  - pytest
  - pip
  - pip:
    - numpy<2.5  # also bind pip's resolver: a pip dep here floated numpy to 2.5 over conda's copy, breaking numba
    - ortools
    - highspy==1.12.*  # must match ortools' bundled HiGHS (SONAME clash); mirrors cytools' own pin
    - mosek
    - triangulumancer
    - pplpy
    - pypalp
    - qpsolvers
    - cygv
    - regfans
    - latticepts
    - fanroots
    - cytools
    - mcp        # MCP server (mcp_server.py) exposing the tools to MCP clients
    - -e .       # editable self-install (cytools-agent); resolves from repo root
  # Agent / loop dependencies
  - openai
  - anthropic
  - httpx
  - python-dotenv
  # Common useful tools
  - jupyterlab
  - ipykernel
  - matplotlib
  - plotly
  - ipywidgets
  - anywidget
