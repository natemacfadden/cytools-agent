name: cytools-agent
channels:
  - conda-forge
dependencies:
  # CYTools dependencies
  - python=3.12
  - numba
  - numpy
  - normaliz
  - scipy
  - cvxopt
  - python-flint
  - ppl
  - joblib
  - tqdm
  - requests
  - osqp
  - pytest
  - pip
  - pip:
    - ortools
    - mosek
    - triangulumancer
    - pplpy
    - pypalp
    - qpsolvers
    - cygv
    - regfans
    - latticepts
    - fanroots
    - cytools
    - mcp        # MCP server (mcp_server.py) exposing the tools to MCP clients
    - -e .       # editable self-install (cytools-agent); resolves from repo root
  # Agent / loop dependencies
  - openai
  - anthropic
  - httpx
  - python-dotenv
  # Common useful tools
  - jupyterlab
  - ipykernel
  - matplotlib
  - plotly
  - ipywidgets
  - anywidget
