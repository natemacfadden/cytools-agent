[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cytools-agent"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["cytools_agent*"]

[tool.setuptools.package-data]
"cytools_agent.tools" = ["ks_counts.json"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["E501"]
